apply plugin: 'com.android.library'

android {
    namespace "com.mivo.levelplay"
    compileSdk 35

    defaultConfig {
        minSdk 23
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'com.unity3d.ads-mediation:mediation-sdk:9.5.0'
}
